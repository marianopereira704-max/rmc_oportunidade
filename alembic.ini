# Configuração do Alembic (controle de versão do esquema do banco).
#
# IMPORTANTE: a URL do banco NÃO fica aqui. Ela é lida em tempo de execução
# por alembic/env.py a partir de core.config.settings.db.url — a mesma
# cadeia st.secrets -> variável de ambiente -> default que o app inteiro
# usa. Assim não existe uma segunda cópia da credencial neste arquivo, que
# vai versionado no git.
#
# Uso normal (a partir da raiz do projeto):
#   alembic upgrade head          aplica as migrações pendentes
#   alembic current               mostra em qual revisão o banco está
#   alembic history               lista as revisões existentes
#   alembic revision --autogenerate -m "descrição"   cria uma migração nova
#
# O app também aplica as migrações sozinho no start (ver core/db.py) —
# estes comandos são para operar/inspecionar o banco pela mão.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
path_separator = os

# Nome dos arquivos de migração: prefixo cronológico + slug da descrição,
# pra pasta versions/ ficar legível em ordem de criação.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
