# Rotina de dados da aba Pedido: API do GPS → Spaces (pacote pedido/).
# Carga inicial e atualização diária são o mesmo comando — ele baixa só o
# que falta. Passo a passo das chaves e de como acompanhar: docs/rotina_pedido.md
#
# ATENÇÃO: o repositório é PÚBLICO, e os logs daqui também. A rotina não
# imprime nome de loja, produto nem valor — só índices, períodos e tempos.
# Os dados vão para o Spaces (privado), nunca para o git.

name: Rotina Pedido (API do GPS)

on:
  schedule:
    # 03:00 UTC = 00:00 em Brasília. O GPS atualiza os dados do dia por volta
    # das 11h–12h; rodando à meia-noite, o dia anterior já está completo.
    - cron: "0 3 * * *"
  workflow_dispatch:  # botão "Run workflow" (carga inicial, reprocessar)
    inputs:
      modo:
        description: "O que rodar"
        type: choice
        default: completa
        options:
          - completa
          - so_precalculo

# Nunca duas rodadas ao mesmo tempo: a segunda espera a primeira terminar.
concurrency:
  group: rotina-pedido
  cancel-in-progress: false

jobs:
  coleta:
    name: Parte ${{ matrix.parte }} de 8
    if: inputs.modo != 'so_precalculo'
    runs-on: ubuntu-latest
    # O GitHub corta em 6 h; a rotina para sozinha antes (PEDIDO_ORCAMENTO_MINUTOS)
    # e a próxima execução continua de onde ela parou.
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        # 8 partes (08/10/2026): com 4, a carga inicial das 388 empresas não
        # cabia nas noites. Se os relatórios mostrarem muitos 502 do GPS
        # (servidor sobrecarregado), voltar pra 4 — aqui e no --partes.
        parte: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coleta
        run: python -m pedido --parte ${{ matrix.parte }} --partes 8
        env:
          RMC_IGNORAR_SECRETS: "1"
          PEDIDO_ORCAMENTO_MINUTOS: "330"
          GPS_API_BASE_URL: ${{ secrets.GPS_API_BASE_URL }}
          GPS_API_KEY: ${{ secrets.GPS_API_KEY }}
          DO_SPACES_ENDPOINT: ${{ secrets.DO_SPACES_ENDPOINT }}
          DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION }}
          DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
          DO_SPACES_ACCESS_KEY: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          DO_SPACES_SECRET_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}
          SISTEMA_INTERNO_BASE_URL: ${{ secrets.SISTEMA_INTERNO_BASE_URL }}
          SISTEMA_INTERNO_TOKEN: ${{ secrets.SISTEMA_INTERNO_TOKEN }}

  # Compras da rede por mês, para a Análise de Oportunidade (pedido/rede.py):
  # depois das 8 partes, mesmo que alguma falhe (o que faltar entra no dia
  # seguinte — o arquivo do mês é refeito quando a lista de lojas muda).
  rede:
    name: Compras da rede (Análise)
    needs: coleta
    if: always() && inputs.modo != 'so_precalculo'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compras da rede
        run: python -m pedido.rede
        env:
          RMC_IGNORAR_SECRETS: "1"
          DO_SPACES_ENDPOINT: ${{ secrets.DO_SPACES_ENDPOINT }}
          DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION }}
          DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
          DO_SPACES_ACCESS_KEY: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          DO_SPACES_SECRET_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}

  # Cálculo de madrugada (pedido/precalculo.py, 29/10/2026): as 4 telas de
  # cada loja (Assistente e Dashboard) prontas no Spaces, com as fotos de
  # estoque que a coleta acabou de gravar; em paralelo com o `rede`. Não
  # alcança o banco: usa as fotos dos insumos que o app publica.
  # No agendamento, só com a variável do repositório PRECALCULO_AGENDADO = 1
  # (Settings → Secrets and variables → Actions → Variables): ligada depois
  # da conferência das lojas reais. No botão, "so_precalculo" roda sempre.
  precalculo:
    name: Pré-cálculo ${{ matrix.parte }} de 8
    needs: coleta
    if: always() && (inputs.modo == 'so_precalculo' || vars.PRECALCULO_AGENDADO == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pré-cálculo
        run: python -m pedido.precalculo --parte ${{ matrix.parte }} --partes 8
        env:
          RMC_IGNORAR_SECRETS: "1"
          PRECALCULO_CHAVE: ${{ secrets.PRECALCULO_CHAVE }}
          DO_SPACES_ENDPOINT: ${{ secrets.DO_SPACES_ENDPOINT }}
          DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION }}
          DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
          DO_SPACES_ACCESS_KEY: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          DO_SPACES_SECRET_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}

  # Alerta por e-mail (pedido/alerta.py, 28/10/2026): só quando a execução
  # trouxe menos do que devia (parte sem relatório, erro, nenhuma foto de
  # estoque, queda de lojas; e, quando o job rodou, o cálculo de madrugada).
  # Falha da rotina inteira o GitHub já avisa. No "so_precalculo" confere só
  # o cálculo (conferir a coleta de novo reenviaria o e-mail da noite).
  alerta:
    name: Alerta por e-mail
    needs: [coleta, rede, precalculo]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Alerta
        run: >-
          python -m pedido.alerta --partes 8
          ${{ inputs.modo == 'so_precalculo' && '--so-precalculo' || '' }}
          ${{ inputs.modo != 'so_precalculo' && needs.precalculo.result != 'skipped' && '--precalculo' || '' }}
        env:
          RMC_IGNORAR_SECRETS: "1"
          DO_SPACES_ENDPOINT: ${{ secrets.DO_SPACES_ENDPOINT }}
          DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION }}
          DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
          DO_SPACES_ACCESS_KEY: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          DO_SPACES_SECRET_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          ALERTA_DESTINATARIOS: ${{ secrets.ALERTA_DESTINATARIOS }}
